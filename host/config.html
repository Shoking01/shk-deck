<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REA RD - Config</title>
<style>
	:root {
		color-scheme: dark;
		--bg: #14151a;
		--surface: #1e2027;
		--surface-2: #262933;
		--border: #33363f;
		--border-strong: #4a4e5a;
		--text: #e8e9ec;
		--muted: #9aa0ad;
		--accent: #4f8cff;
		--accent-strong: #2f6fe0;
		--danger: #e05252;
		--ok: #3fbf6f;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0; padding: 0;
		font-family: "Segoe UI", system-ui, sans-serif;
		font-size: 14px; line-height: 1.5;
		background: var(--bg); color: var(--text);
	}
	button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible,
	.cell:focus-visible {
		outline: 2px solid var(--accent); outline-offset: 2px;
	}

	/* Header */
	header {
		display: flex; align-items: center; gap: 12px;
		padding: 14px 18px;
		border-bottom: 1px solid var(--border);
		background: var(--surface);
	}
	header h1 { font-size: 15px; font-weight: 600; margin: 0; }
	.device-badge {
		display: inline-flex; align-items: center; gap: 6px;
		font-size: 12px; color: var(--muted);
		border: 1px solid var(--border); border-radius: 999px;
		padding: 3px 10px;
	}
	.device-badge .dot {
		width: 8px; height: 8px; border-radius: 50%;
		background: var(--muted);
	}
	.device-badge.connected { color: var(--text); }
	.device-badge.connected .dot { background: var(--ok); }

	/* Layout: deck on the left, details on the right */
	main {
		display: flex; gap: 20px; align-items: flex-start;
		padding: 18px;
	}
	.deck-section { flex: 0 0 auto; }
	.section-label {
		font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
		color: var(--muted); margin: 0 0 10px;
	}
	.grid {
		display: grid;
		grid-template-columns: repeat(5, 96px);
		grid-auto-rows: 96px;
		gap: 10px;
	}
	.cell {
		position: relative;
		border: 1px solid var(--border); border-radius: 10px;
		background: var(--surface) center / cover no-repeat;
		cursor: pointer; user-select: none;
		overflow: hidden;
		transition: border-color 120ms ease, transform 120ms ease;
	}
	.cell:hover { border-color: var(--border-strong); }
	.cell:active { transform: scale(0.97); }
	.cell.assigned { border-color: #3d5a86; }
	.cell.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79, 140, 255, 0.35); }
	.cell .coords {
		position: absolute; top: 5px; left: 6px;
		font-size: 10px; color: var(--muted);
		background: rgba(10, 11, 14, 0.55); border-radius: 4px;
		padding: 1px 5px;
	}
	.cell .key-title {
		position: absolute; left: 0; right: 0; bottom: 0;
		padding: 3px 6px;
		font-size: 11px; font-weight: 600; color: #ffffff;
		text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
		background: linear-gradient(transparent, rgba(10, 11, 14, 0.75));
		white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	}
	.cell .key-label {
		position: absolute; left: 0; right: 0; bottom: 0;
		padding: 4px 6px 5px;
		font-size: 10px; color: #dfe3ea;
		background: linear-gradient(transparent, rgba(10, 11, 14, 0.85));
		white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	}
	.cell.empty::after {
		content: "+";
		position: absolute; inset: 0;
		display: flex; align-items: center; justify-content: center;
		font-size: 20px; color: var(--muted);
	}
	.cell.empty { border-style: dashed; }

	/* Details panel */
	aside {
		flex: 1 1 auto; min-width: 320px; max-width: 420px;
		border: 1px solid var(--border); border-radius: 12px;
		background: var(--surface); padding: 16px;
	}
	aside h2 { font-size: 14px; margin: 0 0 4px; }
	aside .subtitle { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
	.placeholder { color: var(--muted); font-size: 13px; margin: 8px 0; }
	.field { display: block; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
	.field > span { display: block; margin-bottom: 4px; }
	.field select, .field textarea, .field input {
		display: block; width: 100%;
		background: var(--surface-2); color: var(--text);
		border: 1px solid var(--border); border-radius: 6px;
		padding: 8px; font-size: 13px; font-family: inherit;
	}
	.field textarea {
		min-height: 72px; font-family: Consolas, monospace; font-size: 12px;
		resize: vertical;
	}
	.field .invalid { border-color: var(--danger); }
	.app-row { display: flex; gap: 6px; }
	.app-row input { flex: 1 1 auto; min-width: 0; }
	.meta-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
	.chip {
		font-size: 11px; color: var(--text);
		background: var(--surface-2); border: 1px solid var(--border);
		border-radius: 999px; padding: 3px 10px;
	}
	.chip.native { color: #f0c36b; border-color: #6b5a2e; }
	.buttons { display: flex; gap: 8px; margin-top: 4px; }
	button {
		background: var(--accent-strong); color: #ffffff; border: 0; border-radius: 6px;
		padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
		font-family: inherit;
	}
	button:hover { background: var(--accent); }
	button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); font-weight: 400; }
	button.secondary:hover { border-color: var(--border-strong); }
	button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); font-weight: 400; }
	button.danger:hover { background: rgba(224, 82, 82, 0.12); }
	.error { color: #ff8a8a; font-size: 12px; min-height: 18px; margin: 8px 0 2px; }
</style>
</head>
<body>
<header>
	<h1>REA RD</h1>
	<span id="device-badge" class="device-badge"><span class="dot"></span><span id="device-text">SS550V3</span></span>
</header>
<main>
	<section class="deck-section">
		<p class="section-label">Deck 5×3 — click a key to configure</p>
		<div id="grid" class="grid" role="listbox" aria-label="Deck keys"></div>
	</section>
	<aside id="panel" aria-live="polite">
		<h2 id="panel-title">Key details</h2>
		<p id="panel-subtitle" class="subtitle"></p>
		<div id="panel-empty" class="placeholder hidden">Select a key on the deck to assign an action or edit it.</div>
		<div id="assign-fields" class="hidden">
			<label class="field"><span>Plugin</span>
				<select id="plugin-select"></select>
			</label>
			<label class="field"><span>Action</span>
				<select id="action-select"></select>
			</label>
			<label class="field" id="settings-field"><span>Settings (JSON)</span>
				<textarea id="settings-input" spellcheck="false">{}</textarea>
			</label>
			<div id="app-fields" class="hidden">
				<label class="field"><span>Application</span>
					<div class="app-row">
						<input id="app-path-input" type="text" list="apps-datalist" placeholder="Type to search installed apps..." spellcheck="false">
						<button id="app-browse-btn" class="secondary" type="button">Browse...</button>
					</div>
					<datalist id="apps-datalist"></datalist>
				</label>
				<label class="field"><span>Arguments (optional)</span>
					<input id="app-args-input" type="text" placeholder="e.g. --profile-name Work" spellcheck="false">
				</label>
			</div>
			<label class="field"><span>Title color</span>
				<input id="titlecolor-input" type="text" value="#ffffff" spellcheck="false">
			</label>
		</div>
		<div id="panel-error" class="error" role="alert"></div>
		<div id="panel-buttons" class="buttons hidden">
			<button id="save-btn">Assign</button>
			<button id="remove-btn" class="danger">Remove</button>
			<button id="cancel-btn" class="secondary">Cancel</button>
		</div>
	</aside>
</main>
<script src="config.js"></script>
</body>
</html>
