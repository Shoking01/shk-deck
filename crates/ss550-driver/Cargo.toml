[package]
name = "ss550-driver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust driver for Redragon StreamCraft SS550 v3 HID control"
license = "MIT OR Apache-2.0"

[features]
# The tests that need a deck on a desk. Off by default: `cargo test` must
# never touch hardware, and a test that needs a device says so out loud.
hardware-tests = []

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
deck-api = { path = "../deck-api" }
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jpeg-encoder = "0.7"
ss550-protocol = { path = "../ss550-protocol" }
thiserror = "2.0"

[dev-dependencies]
deck-conformance = { path = "../deck-conformance" }
env_logger = "0.11"
tempfile = "3.10"
