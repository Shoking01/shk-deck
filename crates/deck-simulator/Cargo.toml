[package]
name = "deck-simulator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A second deck, so the seam is proven by more than one implementation"
license = "MIT OR Apache-2.0"

[dependencies]
deck-api = { path = "../deck-api" }
deck-conformance = { path = "../deck-conformance" }
ss550-protocol = { path = "../ss550-protocol" }
thiserror = "2.0"

[dev-dependencies]
# The real driver, so the fake is proven against the bytes it will decode in
# the application and not only against packs a test wrote by hand.
ss550-driver = { path = "../ss550-driver" }
jpeg-encoder = "0.7"
