[package]
name = "ss550-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Key bindings and action dispatch for the Redragon StreamCraft SS550 controller"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ss550-driver = { path = "../ss550-driver" }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.10"
