[package]
name = "ss550-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "System tray host and window hiding for the SS550 controller"
license = "MIT OR Apache-2.0"

# Like the GUI crate, this crate is its own workspace root: the Win32 and
# notification-area dependency tree is heavy, and the driver/protocol
# workspace should not pay for it.
[workspace]

# This crate is the only place in the project that is allowed to call
# unsafe code: it owns the Win32 calls that hide and restore the native
# window, and the notification-area icon.
[lints.rust]
unsafe_code = "allow"

[dependencies]
# The engine owns the `KeySender` trait and the `KeyCombo` it takes; this crate
# implements the trait with the platform call. The trait is the seam: the
# engine decides *when* a combination goes out and never *how*, and the crate
# that is allowed `unsafe` is the one that knows how.
ss550-engine = { path = "../ss550-engine" }

[target.'cfg(windows)'.dependencies]
# The notification-area icon is created by `tray-icon`'s Win32 backend, which
# builds a hidden window and needs `Win32_UI_WindowsAndMessaging`; every other
# platform gets the `Unsupported` stub in `tray::other_platform`, so the whole
# dependency stays out of those builds.
tray-icon = "0.26"
# The logon entry lives in HKCU. `winreg` refuses to compile anywhere else,
# which is the correct signal: the whole feature is Windows-only, and the
# non-Windows stubs in `autostart` return `TrayError::Unsupported`.
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # The program's own icon: `SHGetFileInfoW` needs the shell, and its
    # `dwfileattributes` argument is a file-system flag type.
    "Win32_Storage_FileSystem",
    # Fetching a site's icon: `InternetOpenW`, `InternetOpenUrlW`,
    # `InternetReadFile` and the timeout options are WinINet's, and using the
    # system HTTP client is what keeps this a one-file feature instead of a TLS
    # stack.
    "Win32_Networking_WinInet",
    # Resolving a shortcut to its target: `IShellLinkW` is loaded from the
    # `.lnk` through `IPersistFile`, which is a COM call, and `GetPath` fills a
    # `WIN32_FIND_DATAW` from the file-system module above.
    # CreateMutexW and CreateEventW take a SECURITY_ATTRIBUTES pointer, which
    # is what makes the single-instance objects reachable.
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # `IImageList`: the shell's jumbo and extra-large image lists are COM
    # objects, and `SHGetImageList` answers one of them. The interface itself
    # lives in the controls module, which is where Windows declares it.
    "Win32_UI_Controls",
    # `GetOpenFileNameW`: the system's own file dialog, with its filter block.
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    # `SendInput`, and the `INPUT` record it takes: the keystroke sender.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # The current media session: Spotify, a browser tab, the system player.
    # `GlobalSystemMediaTransportControlsSessionManager` is WinRT, and its calls
    # are the one place this crate reads what the machine is playing.
    "Media_Control",
] }

[target.'cfg(windows)'.dev-dependencies]
# The ignored round-trip test restores a logon entry it did not create.
winreg = "0.56"
