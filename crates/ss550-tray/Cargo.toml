[package]
name = "ss550-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "System tray host and window hiding for the SS550 controller"
license = "MIT OR Apache-2.0"

# Like the GUI crate, this crate is its own workspace root: the Win32 and
# notification-area dependency tree is heavy, and the driver/protocol
# workspace should not pay for it.
[workspace]

# This crate is the only place in the project that is allowed to call
# unsafe code: it owns the Win32 calls that hide and restore the native
# window, and the notification-area icon.
[lints.rust]
unsafe_code = "allow"

[dependencies]

[target.'cfg(windows)'.dependencies]
# The notification-area icon is created by `tray-icon`'s Win32 backend, which
# builds a hidden window and needs `Win32_UI_WindowsAndMessaging`; every other
# platform gets the `Unsupported` stub in `tray::other_platform`, so the whole
# dependency stays out of those builds.
tray-icon = "0.26"
# The logon entry lives in HKCU. `winreg` refuses to compile anywhere else,
# which is the correct signal: the whole feature is Windows-only, and the
# non-Windows stubs in `autostart` return `TrayError::Unsupported`.
winreg = "0.55"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
# The ignored round-trip test restores a logon entry it did not create.
winreg = "0.55"
