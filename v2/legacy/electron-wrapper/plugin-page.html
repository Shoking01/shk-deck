<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stream Deck Plugin</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="plugin-container"></div>
    
    <script>
        const pluginUuid = 'test-plugin';
        const wsPort = 9002;
        const pluginDir = 'C:\temp'.replace(/\\/g, '/');
        
        // WebSocket connection
        const ws = new WebSocket('ws://127.0.0.1:' + wsPort);
        
        ws.onopen = () => {
            console.log('[plugin] WebSocket connected');
            
            // Register with host
            const connectElgatoStreamDeckSocket = (port, uuid, eventName, info) => {
                console.log('[plugin] Handshake attempt:', port, uuid, eventName);
                ws.send(JSON.stringify({
                    event: 'registerPlugin',
                    uuid: uuid,
                    payload: { info: JSON.parse(info) }
                }));
            };
            
            // Plugin info
            const info = {
                plugin: { uuid: pluginUuid, version: '1.0' },
                application: {
                    font: 'Segoe UI',
                    language: 'en',
                    platform: 'windows',
                    version: '1.0'
                }
            };
            
            connectElgatoStreamDeckSocket(wsPort, pluginUuid, 'registerPlugin', JSON.stringify(info));
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log('[plugin] Received:', data);
            
            if (data.event === 'willAppear') {
                // Load plugin HTML
                console.log('[plugin] Loading plugin from:', pluginDir);
            }
        };
    </script>
    
    <script>
        // Load plugin's index.html if it exists
        fetch(pluginDir + '/index.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('plugin-container').innerHTML = html;
            })
            .catch(err => {
                console.log('[plugin] No index.html found:', err.message);
                document.getElementById('plugin-container').innerHTML = '<div style="padding:20px;color:#999">Plugin: ' + pluginUuid + '</div>';
            });
    </script>
</body>
</html>
